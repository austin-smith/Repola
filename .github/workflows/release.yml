name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # tauri-action merges every platform into one latest.json asset. Publishing
      # these concurrently races the release asset's replace operation.
      max-parallel: 1
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
            executable_suffix: ""
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
            executable_suffix: ""
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri_args: ""
            executable_suffix: ""
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_args: ""
            executable_suffix: .exe

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile

      - name: Prepare App Store Connect private key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [[ -n "$APPLE_API_PRIVATE_KEY" ]]; then
            umask 077
            key_path="$RUNNER_TEMP/repola-notarization-key.p8"
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Validate release trust and generate signed-build configuration
        env:
          REPOLA_SIGNING_PUBLIC_KEY: ${{ vars.REPOLA_SIGNING_PUBLIC_KEY }}
          REPOLA_WINDOWS_SIGN_COMMAND: ${{ vars.REPOLA_WINDOWS_SIGN_COMMAND }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/prepare-release.mjs

      - name: Build matching remote agent
        working-directory: src-tauri
        run: cargo build --locked --release --package repola-engine --bin repola-agent --target ${{ matrix.target }}

      - name: Stage agent artifact and checksum
        shell: bash
        run: |
          mkdir -p release-agent
          cp "src-tauri/target/${{ matrix.target }}/release/repola-agent${{ matrix.executable_suffix }}" "release-agent/repola-agent-${{ matrix.target }}${{ matrix.executable_suffix }}"
          cd release-agent
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "repola-agent-${{ matrix.target }}${{ matrix.executable_suffix }}" > "repola-agent-${{ matrix.target }}${{ matrix.executable_suffix }}.sha256"
          else
            sha256sum "repola-agent-${{ matrix.target }}${{ matrix.executable_suffix }}" > "repola-agent-${{ matrix.target }}${{ matrix.executable_suffix }}.sha256"
          fi

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign agent artifact with GitHub OIDC identity
        shell: bash
        run: cosign sign-blob --yes --bundle "release-agent/repola-agent-${{ matrix.target }}${{ matrix.executable_suffix }}.sigstore.json" "release-agent/repola-agent-${{ matrix.target }}${{ matrix.executable_suffix }}"

      - name: Sign agent artifact with the pinned Repola updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: pnpm tauri signer sign "release-agent/repola-agent-${{ matrix.target }}${{ matrix.executable_suffix }}"

      - name: Build and upload native desktop bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REPOLA_SIGNING_PUBLIC_KEY: ${{ vars.REPOLA_SIGNING_PUBLIC_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Repola v__VERSION__
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }} --config src-tauri/tauri.release.conf.json
          uploadUpdaterJson: true

      - name: Upload matching agent assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "v$(node -p "require('./package.json').version")" release-agent/* --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-${{ matrix.target }}
          path: release-agent/
          if-no-files-found: error

      - name: Remove App Store Connect private key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/repola-notarization-key.p8"

  agent-linux-arm64:
    name: Linux ARM64 remote agent
    needs: package
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: release-aarch64-unknown-linux-gnu
      - run: pnpm install --frozen-lockfile

      - name: Validate release trust
        env:
          REPOLA_SIGNING_PUBLIC_KEY: ${{ vars.REPOLA_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/prepare-release.mjs

      - name: Build matching remote agent
        working-directory: src-tauri
        run: cargo build --locked --release --package repola-engine --bin repola-agent --target aarch64-unknown-linux-gnu

      - name: Stage agent artifact and checksum
        shell: bash
        run: |
          mkdir -p release-agent
          cp src-tauri/target/aarch64-unknown-linux-gnu/release/repola-agent release-agent/repola-agent-aarch64-unknown-linux-gnu
          cd release-agent
          sha256sum repola-agent-aarch64-unknown-linux-gnu > repola-agent-aarch64-unknown-linux-gnu.sha256

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign agent artifact with GitHub OIDC identity
        shell: bash
        run: cosign sign-blob --yes --bundle release-agent/repola-agent-aarch64-unknown-linux-gnu.sigstore.json release-agent/repola-agent-aarch64-unknown-linux-gnu

      - name: Sign agent artifact with the pinned Repola updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri signer sign release-agent/repola-agent-aarch64-unknown-linux-gnu

      - name: Upload matching agent assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$(node -p "require('./package.json').version")" release-agent/* --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-aarch64-unknown-linux-gnu
          path: release-agent/
          if-no-files-found: error
