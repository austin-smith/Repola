name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run for the selected branch
        required: true
        type: choice
        default: Build installers
        options: [Build installers, Publish nightly]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-build-${{ github.ref }}-${{ inputs.operation || 'release' }}
  cancel-in-progress: false

jobs:
  build-installers:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'Build installers'
    permissions:
      contents: read
    uses: ./.github/workflows/build-installers.yml

  plan:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'Publish nightly'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.metadata.outputs.skip }}
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - name: Require main for manual nightly publication
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REPOLA_SOURCE_REF: ${{ github.ref }}
        run: test "$REPOLA_SOURCE_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Resolve exact source, require green CI, and skip unchanged nightlies
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-metadata.mjs resolve "$RUNNER_TEMP/repola-release/metadata/release.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.metadata.outputs.skip != 'true'
        with:
          name: release-metadata
          path: ${{ runner.temp }}/repola-release/metadata/release.json
          if-no-files-found: error

  package:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    env:
      REPOLA_RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      REPOLA_SIGNING_PUBLIC_KEY: ${{ vars.REPOLA_SIGNING_PUBLIC_KEY }}
      VITE_REPOLA_RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
      VITE_REPOLA_VERSION: ${{ needs.plan.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            desktop: true
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            desktop: true
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            desktop: true
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            desktop: true
          - label: Linux ARM64 agent
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            desktop: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-metadata
          path: ${{ runner.temp }}/repola-release/metadata
      - name: Revalidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$REPOLA_RELEASE_SHA"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux' && matrix.desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Stamp the same version into desktop, engine, and lockfile
        shell: bash
        run: node scripts/release-metadata.mjs stamp "$RUNNER_TEMP/repola-release/metadata/release.json"
      - name: Prepare App Store Connect private key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [[ -n "$APPLE_API_PRIVATE_KEY" ]]; then
            umask 077
            key_path="$RUNNER_TEMP/repola-notarization-key.p8"
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi
      - name: Validate release trust and prepare native bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/prepare-release.mjs "$RUNNER_TEMP/repola-release/metadata/release.json"
      - name: Build matching remote agent
        working-directory: src-tauri
        run: cargo build --locked --release --package repola-engine --bin repola-agent --target ${{ matrix.target }}
      - name: Build native desktop bundle
        if: matrix.desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json ${{ runner.os != 'macOS' && '--no-sign' || '' }}
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        env:
          REPOLA_TARGET: ${{ matrix.target }}
        run: |
          codesign --verify --deep --strict "src-tauri/target/$REPOLA_TARGET/release/bundle/macos/Repola.app"
          xcrun stapler validate "src-tauri/target/$REPOLA_TARGET/release/bundle/macos/Repola.app"
      - name: Stage, check agent version, and sign final artifact bytes
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/stage-release.mjs ${{ matrix.target }} "$RUNNER_TEMP/repola-release/metadata/release.json" "$RUNNER_TEMP/repola-release/assets"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign agent provenance with GitHub OIDC
        shell: bash
        env:
          REPOLA_TARGET: ${{ matrix.target }}
          REPOLA_AGENT_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          agent="$RUNNER_TEMP/repola-release/assets/repola-agent-$REPOLA_TARGET$REPOLA_AGENT_SUFFIX"
          cosign sign-blob --yes --bundle "$agent.sigstore.json" "$agent"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/repola-release/assets
          if-no-files-found: error
      - name: Remove App Store Connect private key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/repola-notarization-key.p8"

  draft:
    needs: [plan, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: release-verifier
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-metadata
          path: ${{ runner.temp }}/repola-release/metadata
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*-*
          path: ${{ runner.temp }}/repola-release/assets
          merge-multiple: true
      - name: Verify every artifact and assemble complete updater manifest
        shell: bash
        env:
          REPOLA_SIGNING_PUBLIC_KEY: ${{ vars.REPOLA_SIGNING_PUBLIC_KEY }}
        run: node scripts/release-artifacts.mjs "$RUNNER_TEMP/repola-release/assets" "$RUNNER_TEMP/repola-release/metadata/release.json"
      - name: Create or resume the verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs draft "$RUNNER_TEMP/repola-release/assets"

  publish-nightly:
    needs: [plan, draft]
    if: needs.plan.outputs.channel == 'nightly'
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      channel: nightly
