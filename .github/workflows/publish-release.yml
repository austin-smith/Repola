name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verified draft tag to publish, or published tag whose feed needs repair
        required: true
        type: string
      channel:
        description: Release channel (stable publication requires a reviewed draft)
        required: true
        type: choice
        default: stable
        options: [stable, nightly]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      channel:
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Both channel feeds are deployed together. Serialize publication and Pages
    # deployment across channels so an older snapshot cannot erase either feed.
    concurrency:
      group: release-publication
      cancel-in-progress: false
    environment:
      name: ${{ inputs.channel == 'nightly' && 'nightly-release' || 'stable-release' }}
    steps:
      - name: Require the trusted publication workflow on main
        env:
          REPOLA_WORKFLOW_REF: ${{ github.ref }}
        run: test "$REPOLA_WORKFLOW_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: release-verifier
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Reverify the draft and publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOLA_SIGNING_PUBLIC_KEY: ${{ vars.REPOLA_SIGNING_PUBLIC_KEY }}
          REPOLA_TAG: ${{ inputs.tag }}
          REPOLA_CHANNEL: ${{ inputs.channel == 'nightly' && 'nightly' || 'stable' }}
        run: node scripts/publish-release.mjs publish "$REPOLA_TAG" "$REPOLA_CHANNEL" "$RUNNER_TEMP/repola-release/verified-release"
      - name: Rebuild both feeds from verified published releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOLA_SIGNING_PUBLIC_KEY: ${{ vars.REPOLA_SIGNING_PUBLIC_KEY }}
        run: node scripts/release-feeds.mjs "$RUNNER_TEMP/repola-release/pages/updates" "$RUNNER_TEMP/repola-release/verified-feeds"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/repola-release/pages
      - name: Deploy channel manifests
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
