name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish or repair
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        type: choice
        default: stable
        options: [stable, nightly]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      channel:
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Serialize both channels to prevent a stale deployment from overwriting a feed.
    concurrency:
      group: release-publication
      cancel-in-progress: false
    environment:
      name: ${{ inputs.channel == 'nightly' && 'nightly-release' || 'stable-release' }}
    steps:
      - name: Require main
        env:
          REPOLA_WORKFLOW_REF: ${{ github.ref }}
        run: test "$REPOLA_WORKFLOW_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: release-verifier
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOLA_SIGNING_PUBLIC_KEY: ${{ vars.REPOLA_SIGNING_PUBLIC_KEY }}
          REPOLA_TAG: ${{ inputs.tag }}
          REPOLA_CHANNEL: ${{ inputs.channel == 'nightly' && 'nightly' || 'stable' }}
        run: node scripts/release/publish-release.mjs publish "$REPOLA_TAG" "$REPOLA_CHANNEL" "$RUNNER_TEMP/repola-release/verified-release" "$RUNNER_TEMP/repola-release/pages/updates"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/repola-release/pages
      - name: Deploy update feeds
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
