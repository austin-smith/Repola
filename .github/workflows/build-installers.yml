name: Build installers

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: test-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      REPOLA_SIGNING_PUBLIC_KEY: ${{ vars.REPOLA_SIGNING_PUBLIC_KEY }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global --ignore-scripts "$(node --print 'require("./package.json").packageManager')"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: installers-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Azure login for Windows signing
        if: runner.os == 'Windows'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Windows signing runtime
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Prepare Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-signing.ps1 -Operation prepare
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: node scripts/macos-signing.mjs prepare
      - name: Configure installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/prepare-release.mjs --installers
      - name: Build agent
        working-directory: src-tauri
        run: cargo build --locked --release --package repola-engine --bin repola-agent --target ${{ matrix.target }}
      - name: Sign Windows agent
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REPOLA_TARGET: ${{ matrix.target }}
        run: ./scripts/windows-signing.ps1 -Operation sign -FilePath "src-tauri/target/$env:REPOLA_TARGET/release/repola-agent.exe"
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REPOLA_TARGET: ${{ matrix.target }}
        run: |
          $release = "src-tauri/target/$env:REPOLA_TARGET/release"
          $installers = @(Get-ChildItem -LiteralPath "$release/bundle/nsis" -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one Windows installer; found $($installers.Count)." }
          ./scripts/windows-signing.ps1 -Operation verify -FilePath @("$release/repola.exe", "$release/repola-agent.exe", $installers[0].FullName)
      - name: Notarize and verify macOS bundles
        if: runner.os == 'macOS'
        env:
          REPOLA_TARGET: ${{ matrix.target }}
        run: node scripts/macos-signing.mjs verify
      - name: Clean up macOS signing
        if: always() && runner.os == 'macOS'
        run: node scripts/macos-signing.mjs cleanup
      - name: Sign agent and verify updater artifacts
        env:
          REPOLA_TARGET: ${{ matrix.target }}
          REPOLA_AGENT_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node --print 'require("./package.json").version')
          release="src-tauri/target/$REPOLA_TARGET/release"
          agent="$release/repola-agent$REPOLA_AGENT_SUFFIX"
          pnpm tauri signer sign --app-version "$version" "$agent"
          artifacts=("$agent")
          while IFS= read -r -d '' signature; do
            artifacts+=("${signature%.sig}")
          done < <(find "$release/bundle" -type f -name '*.sig' -print0)
          test "${#artifacts[@]}" -gt 1
          cargo run --locked --manifest-path src-tauri/Cargo.toml --package repola-engine --example verify-release -- "$version" "${artifacts[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            src-tauri/target/${{ matrix.target }}/release/repola-agent${{ runner.os == 'Windows' && '.exe' || '' }}
            src-tauri/target/${{ matrix.target }}/release/repola-agent${{ runner.os == 'Windows' && '.exe' || '' }}.sig
          if-no-files-found: error
          retention-days: 14
