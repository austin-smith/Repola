version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # TypeScript 7 drops the compiler API that typescript-eslint needs; move to it deliberately
      # once typescript-eslint supports it rather than through a grouped bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
